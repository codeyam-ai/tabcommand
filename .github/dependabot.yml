version: 2

updates:
  # Grouped and monthly on purpose: this is a small extension with a fast CI
  # run, and a weekly ungrouped cadence would bury real security bumps under
  # routine churn.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned to a 2.x beta by the build; a major bump needs the Vite/MV3
      # packaging path re-verified by hand, not an auto-PR.
      - dependency-name: '@crxjs/vite-plugin'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
