version: 2

# Tuned for "rarely, and only when it matters": security fixes and majors.
#
# Two separate mechanisms are at work here:
#
#   * Security updates fire when an advisory is published, are NOT bound by the
#     schedule below, and are NOT subject to open-pull-requests-limit. They are
#     enabled at the repo level (Settings → Code security), not in this file.
#   * Version updates are the scheduled sweep configured below.
#
# Deliberately NO `ignore:` rules for semver levels. `ignore` filters security
# updates as well as version updates, so ignoring semver-patch to cut noise
# would also swallow a patch-level CVE fix — the opposite of the intent.
# Noise is controlled with grouping and cadence instead, neither of which
# touches security updates.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    groups:
      # Everything routine collapses into one PR you can review or close in a
      # single pass. Majors are deliberately left out of the group, so each
      # arrives as its own PR — a major is a decision, not a chore.
      routine:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
